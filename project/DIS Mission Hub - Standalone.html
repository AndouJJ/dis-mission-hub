  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

/\n  .mono{font-family:var(--mono);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--paper-3)}\n  .mono b{color:var(--paper);font-weight:500}\n  .mono .o{color:var(--orange)}\n\n  .container{max-width:var(--maxw);margin:0 auto;padding:0 32px}\n  .rule{height:1px;background:var(--rule);border:none;margin:0}\n\n  /* ---------- landing ---------- */\n  .landing{\n    position:fixed;inset:0;z-index:200;background:var(--ink);\n    display:flex;flex-direction:column;\n    transition:opacity 0.5s ease, visibility 0.5s;\n    overflow-y:auto;\n  }\n  .landing.hide{opacity:0;visibility:hidden;pointer-events:none}\n  body.entered .landing{display:none}\n\n  .landing-top{\n    display:flex;justify-content:space-between;align-items:center;\n    padding:24px 32px;border-bottom:1px solid var(--rule);\n    font-family:var(--mono);font-size:11px;letter-spacing:0.18em;color:var(--paper-3);text-transform:uppercase;\n  }\n  .landing-top b{color:var(--paper);font-weight:500}\n  .landing-top .o{color:var(--orange)}\n\n  .landing-body{\n    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;\n    text-align:center;padding:48px 24px;gap:32px;\n  }\n  .landing-logo{height:64px;width:auto;animation:fadeUp 0.8s ease both}\n  .landing-title{\n    font-family:var(--serif);font-weight:400;\n    font-size:clamp(72px, 11vw, 156px);line-height:0.9;letter-spacing:-0.025em;margin:0;\n    animation:fadeUp 0.8s 0.1s ease both;\n  }\n  .landing-title em{font-style:italic;color:var(--orange)}\n  .landing-sub{\n    font-family:var(--mono);font-size:12px;letter-spacing:0.4em;color:var(--paper-2);text-transform:uppercase;\n    animation:fadeUp 0.8s 0.2s ease both;\n  }\n\n  .countdown{\n    display:flex;gap:24px;justify-content:center;animation:fadeUp 0.8s 0.3s ease both;\n    margin-top:8px;\n  }\n  .countdown-cell{display:flex;flex-direction:column;align-items:center;gap:4px}\n  .countdown-num{\n    font-family:var(--serif);font-size:clamp(40px, 6vw handle -----\n  const landing = document.getElementById('landing');\n  const handleForm = document.getElementById('handle-form');\n  const handleInput = document.getElementById('handle');\n  const handleRow = handleInput.closest('.handle-row');\n  const welcomeModal = document.getElementById('welcome-modal');\n  const welcomeHandle = document.getElementById('welcome-handle');\n  const welcomeHandle2 = document.getElementById('welcome-handle-2');\n  const welcomeTime = document.getElementById('welcome-time');\n  const welcomeCta = document.getElementById('welcome-cta');\n  const profileHandle = document.getElementById('profile-handle');\n  const ldrYouName = document.getElementById('ldr-you-name');\n\n  function sanitizeHandle(raw){\n    return (raw || '').trim().replace(/^@+/, '').replace(/\\s+/g, '_').replace(/[^A-Za-z0-9_\\-\\.]/g, '').slice(0, 24);\n  }\n\n  handleForm.addEventListener('submit', (e) => {\n    e.preventDefault();\n    const h = sanitizeHandle(handleInput.value);\n    if (!h || h.length < 2) {\n      handleRow.classList.remove('shake');\n      void handleRow.offsetWidth;\n      handleRow.classList.add('shake');\n      handleInput.focus();\n      return;\n    }\n    welcomeHandle.textContent = '@' + h;\n    welcomeHandle2.textContent = '@' + h;\n    profileHandle.textContent = '@' + h;\n    ldrYouName.innerHTML = '@' + h + ' <span class=\"badge you\">YOU<\u002Fspan>';\n    const now = new Date();\n    welcomeTime.textContent = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ' LCL';\n    try { localStorage.setItem('dis_handle', h); } catch(_){}\n    welcomeModal.classList.add('show');\n    welcomeModal.setAttribute('aria-hidden','false');\n  });\n\n  function enterHub(){\n    welcomeModal.classList.remove('show');\n    welcomeModal.setAttribute('aria-hidden','true');\n    landing.classList.add('hide');\n    setTimeout(() => { document.body.classList.add('entered'); }, 500);\n  }\n  welcomeCta.addEventListener('click', enterHub);\n\n  document.getElementById('back-btn').addEventListener('click', () => {\n    document.body.classList.remove('entered');\n    landing.style.display = '';\n    requestAnimationFrame(() => landing.classList.remove('hide'));\n    window.scrollTo({top:0});\n    setTimeout(() => handleInput.focus(), 300);\n  });\n\n  try {\n    const saved = localStorage.getItem('dis_handle');\n    if (saved) {\n      handleInput.value = saved;\n      profileHandle.textContent = '@' + saved;\n      ldrYouName.innerHTML = '@' + saved + ' <span class=\"badge you\">YOU<\u002Fspan>';\n    }\n  } catch(_){}\n\n  // ----- Countdown to Oct 28, 2026 00:00 local -----\n  const TARGET = new Date(2026, 9, 28, 0, 0, 0).getTime(); // month is 0-indexed; 9 = October\n  const cdNodes = document.querySelectorAll('[data-cd]');\n  function pad(n){return String(Math.max(0,n)).padStart(2,'0')}\n  function tickCountdown(){\n    const now = Date.now();\n    const diff = Math.max(0, TARGET - now);\n    const d = Math.floor(diff / 86400000);\n    const h = Math.floor((diff % 86400000) / 3600000);\n    const m = Math.floor((diff % 3600000) / 60000);\n    const s = Math.floor((diff % 60000) / 1000);\n    cdNodes.forEach(node => {\n      const k = node.dataset.cd;\n      if (k === 'd') node.textContent = d;\n      else if (k === 'h') node.textContent = pad(h);\n      else if (k === 'm') node.textContent = pad(m);\n      else if (k === 's') node.textContent = pad(s);\n    });\n  }\n  tickCountdown();\n  setInterval(tickCountdown, 1000);\n\n  // ----- Accessibility (color-blind safe) -----\n  const a11yBtn = document.getElementById('a11y-btn');\n  function applyA11y(on){\n    document.body.classList.toggle('cb-safe', !!on);\n    a11yBtn.classList.toggle('on', !!on);\n    a11yBtn.setAttribute('aria-pressed', on ? 'true' : 'false');\n    try { localStorage.setItem('dis_cb', on ? '1' : '0'); } catch(_){}\n  }\n  a11yBtn.addEventListener('click', () => applyA11y(!document.body.classList.contains('cb-safe')));\n  try { if (localStorage.getItem('dis_cb') === '1') applyA11y(true); } catch(_){}\n\n  // ----- Mission cards: clickable feedback (locked is no-op) -----\n  document.querySelectorAll('.mission-card').forEach(card => {\n    card.addEventListener('click', () => {\n      if (card.classList.contains('locked') || card.dataset.status === 'locked') return;\n      card.style.transform = 'scale(0.99)';\n      setTimeout(() => card.style.transform = '', 120);\n    });\n  });\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
